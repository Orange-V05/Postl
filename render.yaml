services:
  - type: web
    name: postl-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PRIMARY_PROVIDER
        value: openrouter
      - key: AI_FALLBACK_PROVIDERS
        value: ""
      - key: ALLOWED_ORIGINS
        value: https://postl.vercel.app
      - key: OPENROUTER_MODEL
        value: google/gemma-3-27b-it:free
      - key: OPENROUTER_FREE_MODELS
        value: google/gemma-3-27b-it:free
      - key: ALLOW_PAID_AI_MODELS
        value: "false"
      - key: OPENROUTER_HTTP_REFERER
        value: https://postl.vercel.app
      - key: OPENROUTER_APP_TITLE
        value: POSTL
      - key: REQUEST_TIMEOUT_MS
        value: "60000"
      - key: PROVIDER_TIMEOUT_MS
        value: "45000"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: google/gemma-2b-it
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: USER_DAILY_GENERATION_LIMIT
        value: "25"
      - key: USER_DAILY_REPURPOSE_LIMIT
        value: "10"
